<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Tracker</title><style>
body{font:14px system-ui;margin:0;background:#f6f7f9;color:#111}main{max-width:1180px;margin:40px auto;padding:0 20px}h1{font-size:32px;margin-bottom:4px}h2{font-size:20px;margin:28px 0 10px}.cards{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;min-width:110px}.n{font-size:26px;font-weight:700}.group{margin:24px 0}.grouphead{display:flex;align-items:center;gap:9px}.pill{font-size:12px;background:#e9ebef;padding:3px 8px;border-radius:999px}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}th{background:#fafafa}a{color:inherit}.status{font-weight:600}.muted{color:#666}button{padding:9px 14px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}@media(max-width:700px){table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}
</style></head><body><main><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Job Application Tracker</h1><div class="muted">Live from GitHub · grouped by career category</div></div><button onclick="load()">Refresh</button></div><div id="cards" class="cards"></div><div id="out">Loading…</div></main><script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function category(x){const t=((x.category||"")+" "+(x.role||"")+" "+(x.company||"")).toLowerCase();if(/consult|business analyst/.test(t))return"Consulting";if(/quant|trading|trader|systematic/.test(t))return"Quant & Trading";if(/venture|vc|private equity|investment research|hedge fund/.test(t))return"Investing / VC / Hedge Funds";if(/product/.test(t))return"Product";if(/strategy|bizops|business operations|strategic finance/.test(t))return"Strategy & Operations";if(/artificial intelligence|machine learning|\bai\b|generative ai/.test(t))return"AI & Tech";if(/global markets|sales & trading|sales and trading|asset management|investment management|equity|fixed income|credit|structuring|finance/.test(t))return"Markets & Finance";if(/startup|founder|growth/.test(t))return"Startups";if(/engineer|software|developer|technical/.test(t))return"Engineering & Technical";return"Other"}
function table(rows){return '<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Location</th><th>Updated</th><th>Link</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.company)+'</td><td>'+esc(x.role)+'</td><td class="status">'+esc(x.status)+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.last_updated)+'</td><td>'+(x.url?'<a target="_blank" href="'+esc(x.url)+'">Open</a>':'')+'</td></tr>').join("")+'</tbody></table>'}
async function load(){const o=document.getElementById("out");o.textContent="Loading…";try{const r=await fetch("/api/applications",{cache:"no-store"}),j=await r.json();if(!r.ok)throw Error(j.error||"Failed");const a=j.applications||[],counts={};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);document.getElementById("cards").innerHTML='<div class="card"><div class="n">'+a.length+'</div><div>Total</div></div>'+["Started","Applied","Assessment","Interview","Final Round","Offer"].map(s=>'<div class="card"><div class="n">'+(counts[s]||0)+'</div><div>'+s+'</div></div>').join("");const groups={};a.forEach(x=>{const c=category(x);(groups[c]??=[]).push(x)});const order=["Consulting","Product","Strategy & Operations","Markets & Finance","Quant & Trading","Investing / VC / Hedge Funds","AI & Tech","Startups","Engineering & Technical","Other"];o.innerHTML=order.filter(c=>groups[c]?.length).map(c=>'<section class="group"><div class="grouphead"><h2>'+c+'</h2><span class="pill">'+groups[c].length+'</span></div>'+table(groups[c])+'</section>').join("")||'<div class="muted">No applications yet.</div>'}catch(e){o.textContent="Could not load tracker: "+e.message}}
load();
</script></body></html>
