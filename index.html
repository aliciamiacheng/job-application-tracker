<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Tracker</title><style>body{font:14px system-ui;margin:0;background:#f6f7f9;color:#111}main{max-width:1180px;margin:40px auto;padding:0 20px}h1{font-size:32px}.cards{display:flex;gap:12px;margin:20px 0}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;min-width:120px}.n{font-size:26px;font-weight:700}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}th{background:#fafafa}a{color:inherit}.status{font-weight:600}.muted{color:#666}button{padding:9px 14px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}@media(max-width:700px){.cards{flex-wrap:wrap}table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}</style></head><body><main><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Job Application Tracker</h1><div class="muted">Live from GitHub</div></div><button onclick="load()">Refresh</button></div><div id="cards" class="cards"></div><div id="out">Loading…</div></main><script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){const o=document.getElementById("out");o.textContent="Loading…";try{const r=await fetch("/api/applications",{cache:"no-store"}),j=await r.json();if(!r.ok)throw Error(j.error||"Failed");const a=j.applications||[],counts={};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);document.getElementById("cards").innerHTML='<div class="card"><div class="n">'+a.length+'</div><div>Total</div></div>'+["Started","Applied","Assessment","Interview","Offer"].map(s=>'<div class="card"><div class="n">'+(counts[s]||0)+'</div><div>'+s+'</div></div>').join("");o.innerHTML='<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Location</th><th>Updated</th><th>Link</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.company)+'</td><td>'+esc(x.role)+'</td><td class="status">'+esc(x.status)+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.last_updated)+'</td><td>'+(x.url?'<a target="_blank" href="'+esc(x.url)+'">Open</a>':'')+'</td></tr>').join("")+'</tbody></table>'}catch(e){o.textContent="Could not load tracker: "+e.message}}
load();
</script></body></html>
