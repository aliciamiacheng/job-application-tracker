<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application Tracker</title>
<style>
:root{--ink:#18202b;--muted:#6b7280;--line:#e6e9ef;--bg:#f7f8fc;--purple:#7656c8}
*{box-sizing:border-box}
body{font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:38px auto;padding:0 20px}
h1{font-size:32px;margin:0 0 5px}h2{font-size:20px;margin:0}
.top,.toolbar,.actions{display:flex;align-items:center;gap:9px}.top{justify-content:space-between;gap:16px}
.muted{color:var(--muted)}
button{padding:9px 14px;border:1px solid #d7dbe3;border-radius:9px;background:white;cursor:pointer;font:inherit;font-weight:600}
button:hover{background:#f1f3f7}button:disabled{opacity:.55;cursor:wait}
button.primary{background:var(--purple);border-color:var(--purple);color:white}button.primary:hover{background:#6545b6}
button:focus-visible,a:focus-visible{outline:3px solid #b5a3eb;outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:22px 0 24px}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(20,30,55,.035);border-top:4px solid var(--accent,#8b94a3)}
.n{font-size:27px;font-weight:750}.cardlabel{color:#5f6672;margin-top:2px}
.group{margin:25px 0 34px;background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 12px rgba(20,30,55,.04)}
.grouphead{display:flex;align-items:center;gap:9px;padding:14px 16px;background:var(--soft);border-left:5px solid var(--accent)}
.pill{font-size:12px;background:white;padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;background:white}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0f4}
th{background:#fafbfc;color:#596170;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tbody tr:hover{background:#fafbff}tbody tr:last-child td{border-bottom:0}
.statusSelect{border:1px solid #d9dee8;border-radius:8px;padding:6px 8px;background:white;font:inherit;font-weight:650;cursor:pointer}
.saving{opacity:.55;pointer-events:none}
.open{display:inline-block;text-decoration:none;color:#315ea8;background:#eef4ff;padding:6px 9px;border-radius:7px;font-weight:600;white-space:nowrap}
.open:hover{background:#e0ebff}.edit,.delete{padding:6px 9px;border-radius:7px}
.delete{border:0;background:#fff0f0;color:#b33b3b}.delete:hover{background:#ffe1e1}
.notice{margin:12px 0;color:#27805f;min-height:20px}.notice.error,.formError{color:#b33b3b}
dialog{width:min(660px,calc(100% - 32px));border:1px solid var(--line);border-radius:16px;padding:24px;max-height:90vh;box-shadow:0 20px 80px #18202b33}
dialog::backdrop{background:#18202b70}
.dialogHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600}.wide{grid-column:1/-1}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d9dee8;border-radius:8px;font:inherit;background:white;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #ded5f9;border-color:var(--purple)}
textarea{min-height:90px;resize:vertical}.formError{min-height:20px;margin:16px 0 8px}
.formActions{display:flex;justify-content:flex-end;gap:10px}
.empty{padding:30px;background:white;border:1px solid var(--line);border-radius:14px}
@media(max-width:700px){main{margin-top:24px}.top{align-items:flex-start;flex-direction:column}.toolbar{width:100%}table{font-size:12px}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}.group{overflow-x:auto}th,td{padding:10px}.cards{grid-template-columns:repeat(3,1fr)}.formGrid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:27px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Job Application Tracker</h1><div class="muted">Live from GitHub · grouped by career category</div></div>
    <div class="toolbar"><button class="primary" id="addApplication">+ Add application</button><button id="refresh">↻ Refresh</button></div>
  </div>
  <div id="cards" class="cards"></div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <div id="out">Loading…</div>
</main>
<dialog id="editor" aria-labelledby="editorTitle">
  <div class="dialogHead"><h2 id="editorTitle">Add application</h2><button type="button" id="closeEditor" aria-label="Close form">✕</button></div>
  <form id="applicationForm">
    <input type="hidden" name="id">
    <div class="formGrid">
      <label>Company *<input name="company" required maxlength="2000" autocomplete="organization"></label>
      <label>Role *<input name="role" required maxlength="2000"></label>
      <label>Location<input name="location" maxlength="2000" placeholder="e.g. London"></label>
      <label>Category<select name="category" id="categoryInput"></select></label>
      <label class="wide">Application link<input name="url" type="url" maxlength="2000" placeholder="https://… (optional)"></label>
      <label>Status<select name="status" id="statusInput"></select></label>
      <label>Date applied<input name="date_applied" type="date"></label>
      <label>Deadline<input name="deadline" type="date"></label>
      <label class="wide">Notes<textarea name="notes" maxlength="5000" placeholder="Contacts, next steps, or anything to remember"></textarea></label>
    </div>
    <div id="formError" class="formError" role="alert"></div>
    <div class="formActions"><button type="button" id="cancelEditor">Cancel</button><button type="submit" class="primary" id="saveApplication">Add application</button></div>
  </form>
</dialog>
<script>
const byId = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses = ['Interested','Started','Applied','Assessment','Interview','Final Round','Offer','Rejected','Withdrawn'];
const categoryStyle = {
  'Consulting':['#4f72c9','#edf2ff'], 'Product':['#8b5cc7','#f3edff'],
  'Strategy & Operations':['#bf6b8f','#fbeef4'], 'Markets & Finance':['#267d77','#e8f6f4'],
  'Quant & Trading':['#3370a8','#eaf3fb'], 'Investing / VC / Hedge Funds':['#a46c2e','#fbf2e7'],
  'AI & Tech':['#5b68c8','#eef0ff'], 'Startups':['#c25f54','#fff0ed'],
  'Engineering & Technical':['#49765c','#edf6f0'], 'Other':['#737b88','#f1f3f5']
};
const statusColors = {'Applied':'#ffffff','Assessment':'#facc15','Interview':'#facc15','Final Round':'#facc15','Offer':'#38a35a'};
const cardColors = {'Total':'#697386','Started':'#d6a51e', ...statusColors};
let applications = [], submitting = false, loadVersion = 0;
function category(x) {
  if (x.category === 'Uncategorized') return 'Other';
  if (x.category !== 'Other' && categoryStyle[x.category]) return x.category;
  const text = ((x.category || '') + ' ' + (x.role || '') + ' ' + (x.company || '')).toLowerCase();
  if (/consult|business analyst/.test(text)) return 'Consulting';
  if (/quant|trading|trader|systematic/.test(text)) return 'Quant & Trading';
  if (/venture|\bvc\b|private equity|investment research|hedge fund/.test(text)) return 'Investing / VC / Hedge Funds';
  if (/product/.test(text)) return 'Product';
  if (/strategy|bizops|business operations|strategic finance/.test(text)) return 'Strategy & Operations';
  if (/artificial intelligence|machine learning|\bai\b|generative ai/.test(text)) return 'AI & Tech';
  if (/global markets|sales & trading|sales and trading|asset management|investment management|equity|fixed income|credit|structuring|finance/.test(text)) return 'Markets & Finance';
  if (/startup|founder|growth/.test(text)) return 'Startups';
  if (/engineer|software|developer|technical/.test(text)) return 'Engineering & Technical';
  return 'Other';
}
function notice(text, error = false) { byId('notice').textContent = text; byId('notice').className = 'notice' + (error ? ' error' : ''); }
function safeLink(url) { try { return ['http:','https:'].includes(new URL(url).protocol); } catch { return false; } }
async function request(path, data) {
  const response = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || 'Could not save. Please try again.');
  return result;
}
function statusSelect(x) {
  return '<select class="statusSelect" style="background-color:' + (statusColors[x.status] || '#ffffff') + '" aria-label="Status for ' + esc(x.company + ' — ' + x.role) + '" data-id="' + esc(x.id) + '" data-old="' + esc(x.status) + '">' +
    statuses.map(status => '<option' + (status === x.status ? ' selected' : '') + '>' + status + '</option>').join('') + '</select>';
}
function colorStatus(select) { select.style.backgroundColor = statusColors[select.value] || '#ffffff'; }
function table(rows) {
  return '<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Location</th><th>Updated</th><th>Actions</th></tr></thead><tbody>' +
    rows.map(x => '<tr data-id="' + esc(x.id) + '"><td><strong>' + esc(x.company) + '</strong></td><td>' + esc(x.role) + '</td><td>' + statusSelect(x) +
      '</td><td>' + esc(x.location) + '</td><td>' + esc(x.last_updated) + '</td><td><div class="actions">' +
      (safeLink(x.url) ? '<a class="open" target="_blank" rel="noopener noreferrer" href="' + esc(x.url) + '">Open ↗</a>' : '') +
      '<button class="edit" data-action="edit" data-id="' + esc(x.id) + '">Edit</button>' +
      '<button class="delete" data-action="delete" data-id="' + esc(x.id) + '" aria-label="Delete ' + esc(x.company + ' — ' + x.role) + '">Delete</button></div></td></tr>').join('') + '</tbody></table>';
}
async function load() {
  const version = ++loadVersion;
  byId('refresh').disabled = true;
  try {
    const response = await fetch('/api/applications', {cache:'no-store'});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Failed to load tracker.');
    if (version !== loadVersion) return;
    applications = result.applications || [];
    const counts = {};
    applications.forEach(x => counts[x.status] = (counts[x.status] || 0) + 1);
    byId('cards').innerHTML = Object.keys(cardColors).map(status => '<div class="card" style="--accent:' + cardColors[status] + '"><div class="n">' +
      (status === 'Total' ? applications.length : (counts[status] || 0)) + '</div><div class="cardlabel">' + status + '</div></div>').join('');
    const groups = {};
    applications.forEach(x => (groups[category(x)] ??= []).push(x));
    byId('out').innerHTML = Object.keys(categoryStyle).filter(c => groups[c]?.length).map(c => {
      const [accent, soft] = categoryStyle[c];
      return '<section class="group" style="--accent:' + accent + ';--soft:' + soft + '"><div class="grouphead"><h2>' + c +
        '</h2><span class="pill">' + groups[c].length + '</span></div>' + table(groups[c]) + '</section>';
    }).join('') || '<div class="empty">No applications yet. Use <strong>+ Add application</strong> to get started.</div>';
  } catch (error) { notice('Could not load tracker: ' + error.message, true); if (!applications.length) byId('out').textContent = 'Try refreshing the tracker.'; }
  finally { if (version === loadVersion) byId('refresh').disabled = false; }
}
function openEditor(id = '') {
  const record = id ? applications.find(x => x.id === id) : {status:'Started'};
  if (!record) return;
  const form = byId('applicationForm');
  form.reset();
  for (const field of ['id','company','role','location','url','status','date_applied','deadline','notes']) form.elements.namedItem(field).value = record[field] || '';
  const group = id ? category(record) : '';
  form.elements.namedItem('category').value = group === 'Other' ? 'Uncategorized' : group;
  colorStatus(byId('statusInput'));
  byId('editorTitle').textContent = id ? 'Edit application' : 'Add application';
  byId('saveApplication').textContent = id ? 'Save changes' : 'Add application';
  byId('formError').textContent = '';
  byId('editor').showModal();
  form.elements.namedItem('company').focus();
}
function closeEditor() { if (!submitting) byId('editor').close(); }
byId('categoryInput').innerHTML = '<option value="">Choose automatically</option>' + Object.keys(categoryStyle).map(c => '<option value="' + esc(c === 'Other' ? 'Uncategorized' : c) + '">' + esc(c) + '</option>').join('');
byId('statusInput').innerHTML = statuses.map(s => '<option>' + s + '</option>').join('');
byId('statusInput').addEventListener('change', event => colorStatus(event.currentTarget));
byId('addApplication').addEventListener('click', () => openEditor());
byId('refresh').addEventListener('click', () => load());
byId('closeEditor').addEventListener('click', closeEditor);
byId('cancelEditor').addEventListener('click', closeEditor);
byId('editor').addEventListener('cancel', event => { if (submitting) event.preventDefault(); });
byId('applicationForm').addEventListener('submit', async event => {
  event.preventDefault();
  if (submitting) return;
  const data = Object.fromEntries(new FormData(event.currentTarget));
  submitting = true;
  byId('saveApplication').disabled = true;
  byId('formError').textContent = '';
  try {
    const result = await request(data.id ? '/api/update-application' : '/api/save-job', data);
    if (result.duplicate) { byId('formError').textContent = 'Already tracked as ' + result.id + '. Edit the existing application instead.'; return; }
    byId('editor').close();
    notice(data.id ? 'Application updated.' : 'Application added.');
    await load();
  } catch (error) { byId('formError').textContent = error.message; }
  finally { submitting = false; byId('saveApplication').disabled = false; }
});
byId('out').addEventListener('change', async event => {
  const select = event.target.closest('.statusSelect');
  if (!select) return;
  const old = select.dataset.old;
  colorStatus(select);
  select.disabled = true;
  try { await request('/api/update-status', {id:select.dataset.id, status:select.value}); notice('Status updated.'); await load(); }
  catch (error) { select.value = old; notice(error.message, true); }
  finally { colorStatus(select); select.disabled = false; }
});
byId('out').addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  if (button.dataset.action === 'edit') { openEditor(button.dataset.id); return; }
  const record = applications.find(x => x.id === button.dataset.id);
  if (!record || !confirm('Delete ' + record.company + ' — ' + record.role + '?')) return;
  button.disabled = true;
  try { await request('/api/delete-application', {id:record.id}); notice('Application deleted.'); await load(); }
  catch (error) { notice(error.message, true); }
  finally { button.disabled = false; }
});
load();
</script>
</body>
</html>
