<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Tracker</title><style>
:root{--ink:#18202b;--muted:#6b7280;--line:#e6e9ef;--bg:#f7f8fc;--white:#fff;--purple:#7656c8;--purple-soft:#f1edff}
*{box-sizing:border-box}body{font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink)}main{max-width:1180px;margin:38px auto;padding:0 20px}h1{font-size:32px;margin:0 0 5px}h2{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:var(--muted)}
button{padding:9px 14px;border:1px solid #d7dbe3;border-radius:9px;background:white;cursor:pointer;font-weight:600}button:hover{background:#f1f3f7}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:22px 0 30px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(20,30,55,.035);border-top:4px solid var(--accent,#8b94a3)}.n{font-size:27px;font-weight:750}.cardlabel{color:#5f6672;margin-top:2px}
.group{margin:25px 0 34px;background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 12px rgba(20,30,55,.04)}.grouphead{display:flex;align-items:center;gap:9px;padding:14px 16px;background:var(--soft);border-left:5px solid var(--accent)}.pill{font-size:12px;background:white;padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0f4}th{background:#fafbfc;color:#596170;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tbody tr:hover{background:#fafbff}tbody tr:last-child td{border-bottom:0}
.status{font-weight:700}.status span{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px}.s-started{background:#fff4d6;color:#805c00}.s-applied{background:#e8f1ff;color:#245ca6}.s-assessment{background:#f3e9ff;color:#7040a0}.s-interview{background:#e4f7f0;color:#15745a}.s-final-round{background:#dff7f5;color:#08716b}.s-offer{background:#dff5e5;color:#176b35}.s-rejected,.s-withdrawn{background:#f1f2f4;color:#666}.open{display:inline-block;text-decoration:none;color:#315ea8;background:#eef4ff;padding:5px 9px;border-radius:7px;font-weight:600}.open:hover{background:#e0ebff}
@media(max-width:700px){main{margin-top:24px}.top{align-items:flex-start}table{font-size:12px}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}.group{overflow-x:auto}}
</style></head><body><main><div class="top"><div><h1>Job Application Tracker</h1><div class="muted">Live from GitHub · grouped by career category</div></div><button onclick="load()">↻ Refresh</button></div><div id="cards" class="cards"></div><div id="out">Loading…</div></main><script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function category(x){const t=((x.category||"")+" "+(x.role||"")+" "+(x.company||"")).toLowerCase();if(/consult|business analyst/.test(t))return"Consulting";if(/quant|trading|trader|systematic/.test(t))return"Quant & Trading";if(/venture|vc|private equity|investment research|hedge fund/.test(t))return"Investing / VC / Hedge Funds";if(/product/.test(t))return"Product";if(/strategy|bizops|business operations|strategic finance/.test(t))return"Strategy & Operations";if(/artificial intelligence|machine learning|\bai\b|generative ai/.test(t))return"AI & Tech";if(/global markets|sales & trading|sales and trading|asset management|investment management|equity|fixed income|credit|structuring|finance/.test(t))return"Markets & Finance";if(/startup|founder|growth/.test(t))return"Startups";if(/engineer|software|developer|technical/.test(t))return"Engineering & Technical";return"Other"}
const categoryStyle={"Consulting":["#4f72c9","#edf2ff"],"Product":["#8b5cc7","#f3edff"],"Strategy & Operations":["#bf6b8f","#fbeef4"],"Markets & Finance":["#267d77","#e8f6f4"],"Quant & Trading":["#3370a8","#eaf3fb"],"Investing / VC / Hedge Funds":["#a46c2e","#fbf2e7"],"AI & Tech":["#5b68c8","#eef0ff"],"Startups":["#c25f54","#fff0ed"],"Engineering & Technical":["#49765c","#edf6f0"],"Other":["#737b88","#f1f3f5"]};
const cardColors={"Total":"#697386","Started":"#d6a51e","Applied":"#4b83cc","Assessment":"#9562c5","Interview":"#2b9a78","Final Round":"#15958d","Offer":"#38a35a"};
function statusBadge(s){const cls="s-"+String(s||"").toLowerCase().replace(/\s+/g,"-");return '<span class="'+cls+'">'+esc(s)+'</span>'}
function table(rows){return '<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Location</th><th>Updated</th><th>Link</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><strong>'+esc(x.company)+'</strong></td><td>'+esc(x.role)+'</td><td class="status">'+statusBadge(x.status)+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.last_updated)+'</td><td>'+(x.url?'<a class="open" target="_blank" href="'+esc(x.url)+'">Open ↗</a>':'<span class="muted">—</span>')+'</td></tr>').join("")+'</tbody></table>'}
async function load(){const o=document.getElementById("out");o.textContent="Loading…";try{const r=await fetch("/api/applications",{cache:"no-store"}),j=await r.json();if(!r.ok)throw Error(j.error||"Failed");const a=j.applications||[],counts={};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);const labels=["Total","Started","Applied","Assessment","Interview","Final Round","Offer"];document.getElementById("cards").innerHTML=labels.map(s=>'<div class="card" style="--accent:'+cardColors[s]+'"><div class="n">'+(s==="Total"?a.length:(counts[s]||0))+'</div><div class="cardlabel">'+s+'</div></div>').join("");const groups={};a.forEach(x=>{const c=category(x);(groups[c]??=[]).push(x)});const order=["Consulting","Product","Strategy & Operations","Markets & Finance","Quant & Trading","Investing / VC / Hedge Funds","AI & Tech","Startups","Engineering & Technical","Other"];o.innerHTML=order.filter(c=>groups[c]?.length).map(c=>{const [accent,soft]=categoryStyle[c];return '<section class="group" style="--accent:'+accent+';--soft:'+soft+'"><div class="grouphead"><h2>'+c+'</h2><span class="pill">'+groups[c].length+'</span></div>'+table(groups[c])+'</section>'}).join("")||'<div class="muted">No applications yet.</div>'}catch(e){o.textContent="Could not load tracker: "+e.message}}
load();
</script></body></html>
