name: Update application tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ingest queue and generate dashboard
        run: |
          python tracker.py ingest
          python tracker.py dashboard
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications.csv APPLICATIONS.md
          git diff --cached --quiet || git commit -m "Update application tracker"
          git push
